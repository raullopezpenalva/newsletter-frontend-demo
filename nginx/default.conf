server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Newsletter backend
    location /api/v1/newsletter/ {
        proxy_pass http://testnewsletter_service:8080/api/v1/newsletter/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Contact backend
    location /api/v1/contact/ {
        proxy_pass https://raullopezpenalva.com/api/v1/contact/;
        proxy_set_header Host raullopezpenalva.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_ssl_server_name on;
        proxy_ssl_name raullopezpenalva.com;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Static assets generated by Vite
    location /assets/ {
        try_files $uri =404;
    }

    # Optional: favicon, manifest, robots, etc.
    location = /favicon.ico {
        try_files $uri =404;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}